name: Check updater
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'certifi>=2026.2.25' 'Pillow==12.3.0' 'numpy>=2,<3' 'imageio-ffmpeg>=0.6,<0.7'
      - run: python -B -m unittest discover -s standalone/tests
      - run: node standalone/tests/relation-optional-action.cjs
      - run: node standalone/tests/scene-entry.cjs
      - run: node standalone/tests/scene-scale-shadow.cjs
      - run: node standalone/tests/indexed-talks.cjs
      - run: node standalone/tests/remote-talks.cjs
      - run: node standalone/tests/story-discard-exit.cjs
      - run: node standalone/tests/branch-stale-metadata.cjs
      - run: node standalone/tests/unfinished-page-save.cjs
      - run: node standalone/tests/goals-incomplete-navigation.cjs
      - run: node standalone/tests/messages-incomplete-navigation.cjs
      - run: node standalone/tests/draft-save-inputs.cjs
      - run: node standalone/tests/remote-scene.cjs
      - run: node standalone/tests/event-list-cache.cjs
      - run: node standalone/tests/bulk-references.cjs
      - run: node standalone/tests/all-story-export.cjs
      - run: node qa/tests/dialogue-text.cjs
      - run: node qa/tests/scene-engine.cjs
      - run: node standalone/tests/implicit-entry-edit.cjs
      - run: node standalone/tests/story-import-performance.cjs
      - run: node standalone/tests/story-list-performance.cjs
      - run: node standalone/tests/dialogue-step-pagination.cjs
      - run: node standalone/tests/branch-option-index.cjs
      - run: node standalone/tests/event-empty-performance.cjs
      - run: node standalone/tests/talk-field-scan.cjs
      - run: node standalone/tests/save-payload-state.cjs
      - run: node standalone/tests/up-audio-warning.cjs
      - run: node standalone/tests/mac-folder-bridge.cjs
      - run: node standalone/tests/json-unrelated-save.cjs
      - run: node standalone/tests/remote-routing.cjs
      - run: node --expose-gc standalone/tests/remote-load-order.cjs
      - name: Prepare settings browser checks
        if: runner.os == 'Linux'
        run: |
          npm install --prefix "$RUNNER_TEMP/studio-browser-checks" --no-save --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/studio-browser-checks/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test settings update entry and polling
        if: runner.os == 'Linux'
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/studio-browser-checks/node_modules/playwright
        run: |
          node standalone/tests/settings-open.cjs
          node standalone/tests/app-updates-poll.cjs
          node standalone/tests/up-video-ui.cjs
          node standalone/tests/condition-native-numeric.cjs
          node standalone/tests/condition-talk-references.cjs
          node standalone/tests/unfinished-draft-ui.cjs
          node standalone/tests/social-comment-edit.cjs
      - run: python -B tools/build_update.py --out release/student-age-studio-update.zip
