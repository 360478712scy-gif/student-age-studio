name: Check updater
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'certifi>=2026.2.25' 'Pillow==12.3.0' 'numpy>=2,<3'
      - run: python -B -m unittest discover -s standalone/tests -p test_save_large.py
      - run: python -B -m unittest discover -s standalone/tests -p test_talk_patch.py
      - run: node standalone/tests/indexed-talks.cjs
      - run: node standalone/tests/remote-talks.cjs
      - run: node standalone/tests/remote-scene.cjs
      - run: python -B -m unittest discover -s standalone/tests -p test_talk_segments.py
      - run: python -B -m unittest discover -s standalone/tests -p test_segment_search.py
      - run: node standalone/tests/bulk-references.cjs
      - run: node qa/tests/dialogue-text.cjs
      - run: python -B -m unittest discover -s standalone/tests -p test_app_updates.py
      - run: python -B -m unittest discover -s standalone/tests -p test_ui_resources.py
      - run: python -B -m unittest discover -s standalone/tests -p test_user_chains.py
      - run: python -B -m unittest discover -s standalone/tests -p test_pr_regressions.py
      - run: python -B -m unittest discover -s standalone/tests -p test_external_usages.py
      - run: python -B -m unittest discover -s standalone/tests -p test_plugin_mode.py
      - run: python -B -m unittest discover -s standalone/tests -p test_editor_music.py
      - run: python -B -m unittest discover -s standalone/tests -p test_story_space_isolation.py
      - run: node qa/tests/scene-engine.cjs
      - run: python -B tools/build_update.py --out release/student-age-studio-update.zip
