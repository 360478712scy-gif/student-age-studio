name: Publish code update
on:
  push:
    branches: [main]
    paths: ['standalone/error_logs.py', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-code-update
  cancel-in-progress: false
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'certifi>=2026.2.25' 'Pillow==12.3.0' 'numpy>=2,<3'
      - run: python -B -m unittest discover -s standalone/tests
      - run: node standalone/tests/relation-optional-action.cjs
      - run: node standalone/tests/indexed-talks.cjs
      - run: node standalone/tests/remote-talks.cjs
      - run: node standalone/tests/remote-scene.cjs
      - run: node standalone/tests/event-list-cache.cjs
      - run: node standalone/tests/bulk-references.cjs
      - run: node standalone/tests/catalog-preload.cjs
      - run: node standalone/tests/bgm-editor.cjs
      - run: node standalone/tests/bgm-playback.cjs
      - run: node standalone/tests/story-id-claims.cjs
      - run: node standalone/tests/timeline-folder-drop.cjs
      - run: node qa/tests/dialogue-text.cjs
      - run: node qa/tests/scene-engine.cjs
  publish:
    needs: validate
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'certifi>=2026.2.25' 'Pillow==12.3.0' 'numpy>=2,<3'
      - name: Test updater
        run: python -B -m unittest discover -s standalone/tests -p test_app_updates.py
      - name: Test native dialogue bindings
        run: python -B -m unittest discover -s standalone/tests -p test_external_usages.py
      - name: Read and validate version
        id: version
        shell: bash
        run: |
          tag="$(python -c 'import sys; sys.path.insert(0,"standalone"); from error_logs import APP_VERSION; print(APP_VERSION if APP_VERSION.startswith("beta-") else "v"+APP_VERSION)')"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Version tag must match APP_VERSION" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build checked update asset
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: python -B tools/build_update.py --version "$RELEASE_TAG" --out release/student-age-studio-update.zip
      - name: Publish lightweight update channel
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git fetch origin updates; then
            git worktree add /tmp/studio-feed FETCH_HEAD
          else
            git worktree add --detach /tmp/studio-feed HEAD
            git -C /tmp/studio-feed checkout --orphan updates
            git -C /tmp/studio-feed rm -rf .
          fi
          cp release/student-age-studio-update.zip /tmp/studio-feed/
          git -C /tmp/studio-feed add student-age-studio-update.zip
          git -C /tmp/studio-feed diff --cached --quiet || git -C /tmp/studio-feed commit -m "Code payload $RELEASE_TAG"
          export PAYLOAD_COMMIT=$(git -C /tmp/studio-feed rev-parse HEAD)
          python - <<'PYFEED'
          import hashlib,json,os
          from pathlib import Path
          p=Path('/tmp/studio-feed/student-age-studio-update.zip');data=p.read_bytes()
          feed={'format':1,'runtimeAbi':1,'version':os.environ['RELEASE_TAG'],'commit':os.environ['PAYLOAD_COMMIT'],'sha256':hashlib.sha256(data).hexdigest(),'size':len(data),'notes':Path('docs/releases/v13118.md').read_text(encoding='utf-8')}
          Path('/tmp/studio-feed/latest.json').write_text(json.dumps(feed,ensure_ascii=False,indent=2),encoding='utf-8')
          PYFEED
          git -C /tmp/studio-feed add latest.json
          git -C /tmp/studio-feed diff --cached --quiet || git -C /tmp/studio-feed commit -m "Update channel $RELEASE_TAG"
          git -C /tmp/studio-feed push origin HEAD:updates
      - name: Restore beta-1.3.1 update compatibility
        if: steps.version.outputs.tag == 'beta-1.3.1'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          # Existing, tested code payload only; preserve both full client archives.
          expected=76d873715f0003f18d37ae3ddb26e9f74750fbf4afe42465718a2546661cdbaa
          echo "$expected  release/student-age-studio-update.zip" | sha256sum --check
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > release/existing-assets.json
          present=$(python -c 'import json; print(next((a.get("digest", "") for a in json.load(open("release/existing-assets.json"))["assets"] if a["name"] == "student-age-studio-update.zip"), "missing"))')
          if [[ "$present" == "sha256:$expected" ]]; then
            echo "The verified compatibility asset is already published."
          elif [[ "$present" == missing ]]; then
            gh release upload "$RELEASE_TAG" release/student-age-studio-update.zip
          else
            echo "Existing compatibility asset differs; refusing to replace it." >&2
            exit 1
          fi
      - name: Publish one compatibility update for older clients
        if: steps.version.outputs.tag == 'v1.3.0-beta.5'

        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; keeping its published assets unchanged."
            exit 0
          fi
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release/student-age-studio-update.zip release/student-age-studio-update.zip.sha256 --target "$GITHUB_SHA" --notes-file docs/releases/v13118.md "${flags[@]}"

  windows-launcher:
    needs: publish
    if: needs.publish.outputs.tag == 'v1.3.0-beta.5'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build small replacement launcher for beta.4
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.3.0-beta.4 --pattern 'StudentAgeStudio-Windows-x64-1.3.0-beta.4.zip' --dir "$env:RUNNER_TEMP"
          if($LASTEXITCODE -ne 0){throw 'Original client download failed'}
          $archive=Join-Path $env:RUNNER_TEMP 'StudentAgeStudio-Windows-x64-1.3.0-beta.4.zip'
          if((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '8bd27e155f494089b73c532fe8d5ce345071a705ba71d3a9712059eccca283fd'){throw 'Original client checksum mismatch'}
          Expand-Archive $archive -DestinationPath "$env:RUNNER_TEMP/client"
          $package=Join-Path $env:RUNNER_TEMP 'client/StudentAgeStudio-Windows-x64-1.3.0-beta.4'
          $manifest=Join-Path $env:RUNNER_TEMP 'runtime-sha256.txt'
          Get-ChildItem "$package/runtime" -File -Recurse -Filter *.dll | Sort-Object FullName | ForEach-Object {((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())+'  '+$_.FullName.Substring($package.Length+1)} | Set-Content $manifest -Encoding ASCII
          New-Item -ItemType Directory "$env:RUNNER_TEMP/launcher" | Out-Null
          $csc=Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          & $csc /nologo /target:winexe /reference:System.Windows.Forms.dll "/resource:$manifest,runtime-sha256.txt" "/out:$env:RUNNER_TEMP/launcher/拾光工坊.exe" "$(Join-Path $env:GITHUB_WORKSPACE 'desktop\windows\Launcher.cs')"
          if($LASTEXITCODE -ne 0){throw 'Launcher compile failed'}
          '仅用于官方 Windows x64 1.3.0-beta.4：关闭软件，将本文件夹内的拾光工坊.exe替换到已解压客户端的同名文件位置，runtime文件夹保留。启动器仅在校验DLL与原包一致后解除该DLL的下载标记；不修改系统防护。无需重装完整客户端。' | Set-Content "$env:RUNNER_TEMP/launcher/使用说明.txt" -Encoding utf8
          Compress-Archive "$env:RUNNER_TEMP/launcher/*" "$env:RUNNER_TEMP/StudentAgeStudio-Windows-launcher-beta4.zip"
          gh release upload v1.3.0-beta.5 "$env:RUNNER_TEMP/StudentAgeStudio-Windows-launcher-beta4.zip" --clobber
          if($LASTEXITCODE -ne 0){throw 'Launcher upload failed'}
