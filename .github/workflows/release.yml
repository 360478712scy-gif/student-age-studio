name: Publish code update
on:
  push:
    branches: [main]
    paths: ['standalone/error_logs.py']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-code-update
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'certifi>=2026.2.25'
      - name: Test updater
        run: python -B -m unittest discover -s standalone/tests -p test_app_updates.py
      - name: Read and validate version
        id: version
        shell: bash
        run: |
          tag="$(python -c 'import sys; sys.path.insert(0,"standalone"); from error_logs import APP_VERSION; print("v"+APP_VERSION)')"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Version tag must match APP_VERSION" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build checked update asset
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: python -B tools/build_update.py --version "$RELEASE_TAG" --out release/student-age-studio-update.zip
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; keeping its published assets unchanged."
            exit 0
          fi
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release/student-age-studio-update.zip release/student-age-studio-update.zip.sha256 --target "$GITHUB_SHA" --generate-notes "${flags[@]}"
